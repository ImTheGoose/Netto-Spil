shopConfig:
  - name: "Butik 1 (København)"
    x: 1000
    y: 700
    size: 70
    price: 0
    clickAmount: 200
    texture:
      grey: 'nettoSpriteGrey'
      progress: 'nettoSprite'
    menuButtons:
      upgrade:
      #Upgrade 1 config
      - icon: 'customerIcon'
        startPrice: 100
        priceMultiplier: 1.2
        defaultValue: 25
        maxValue: 1000
        valueIncrement: 25
        valueSuffix: ''
        scale: 0.5

      #Upgrade 2 config
      - icon: 'cashierIcon'
        startPrice: 300
        priceMultiplier: 1.3
        defaultValue: 100
        maxValue: 400
        valueIncrement: 10
        valueSuffix: '%'
        scale: 0.5

      #Upgrade 3 config
      - icon: 'coinHandIcon'
        startPrice: 500
        priceMultiplier: 1.5
        defaultValue: 1
        maxValue: 2
        valueIncrement: 0.05
        valueSuffix: 'x'
        scale: 0.5

  - name: "Butik 2 (Odense)"
    x: 600
    y: 800
    price: 500
    menuButtons:
      upgrade:
      - priceMultiplier: 1.4
      - priceMultiplier: 1.6
      - priceMultiplier: 2

  - name: "Butik 3 (Aarhus)"
    x: 550
    y: 550
    price: 7500
    menuButtons:
      upgrade:
      - priceMultiplier: 1.6
      - priceMultiplier: 1.8
      - priceMultiplier: 2.3

  - name: "Butik 4 (Skagen)"
    x: 550
    y: 100
    price: 50000
    menuButtons:
      upgrade:
      - priceMultiplier: 2
      - priceMultiplier: 2.4
      - priceMultiplier: 2.8


menu:
  contentPadding: 0 #Padding between objects in menu.
  initialOffset: 280 #The offset of contents from top of menu

  menu1:
    name: 'Butikker'
    icon: 'shopIcon' #Matching an asset name
    index: 3 #Determines which slot it should be in.
    labelPadding: 40 #Padding between label and buttons
    labelSize: 35
    labelColor: '#ffffff' #Hex Value
    labelFontWeight: 'Medium' #Bold, SemiBold, Medium or Regular
  
  menu2:
    name: 'Marketing'
    icon: 'marketingIcon'
    index: 2

  menu3:
    name: 'Managers'
    icon: 'managerIcon'
    index: 1
  
  menu4:
    name: 'World'
    icon: 'worldIcon'
    index: 0

texture:
  shopButton:
    button: 'button'
    greyButton: 'greyButton'
  
  nettoSkin:
    grey: 'nettoSpriteGrey'
    progress: 'nettoSprite'
  
  addButton:
    button: 'addButton'
    greyButton: 'addButtonGrey'
  prestigeMenuButton:
    button: 'prestigeMenuButton'
    greyButton: 'prestigeMenuButton'
    
#Assets are looped in the GameScene and loaded from there.
assets:
  # General Menu Assets
  - name: "menuBackground"
    path: "assets/UI/menuBackdrop.png"
  - name: "inactiveMenuTab"
    path: "assets/UI/inactiveMenuTab.png"
  - name: "activeMenuTab"
    path: "assets/UI/activeMenuTab.png"
  
  # Menu Icons
  - name: "shopIcon"
    path: "assets/UI/shopIcon.png"
  - name: "marketingIcon"
    path: "assets/UI/marketingIcon.png"
  - name: "managerIcon"
    path: "assets/UI/managerIcon.png"
  - name: "worldIcon"
    path: "assets/UI/worldIcon.png"
  
  # Map, Buttons and Shops Assets
  - name: "map"
    path: "assets/DK-Kort.png"
  - name: "testB"
    path: "assets/UI/testButton.png"
  - name: "testBDown"
    path: "assets/UI/testButtonDown.png"
  - name: "testBLocked"
    path: "assets/UI/testButtonLocked.png"
  - name: "nettoSprite"
    path: "assets/UI/nettoSprite.png"
  - name: "nettoSpriteGrey"
    path: "assets/UI/nettoSpriteGray.png"
  
  # Buttons and Additional Assets
  - name: "button"
    path: "assets/UI/button.png"
  - name: "greyButton"
    path: "assets/UI/greyButton.png"
  - name: "addButton"
    path: "assets/UI/addButton.png"
  - name: "addButtonGrey"
    path: "assets/UI/addButtonGrey.png"
  
  # Button Icons
  - name: "customerIcon"
    path: "assets/UI/customerIcon.png"
  - name: "cashierIcon"
    path: "assets/UI/cashierIcon.png"
  - name: "coinHandIcon"
    path: "assets/UI/coinHandIcon.png"

  #UI stuff
  - name: "prestigeIcon"
    path: "assets/UI/prestigeIcon.png"
  - name: "coin"
    path: "assets/UI/coin.png"
  - name: "moneyBackground"
    path: "assets/UI/moneyBackground.png"
  - name: "prestigeMenuButton"
    path: "assets/UI/prestigeButton.png"

